<script>
// === src/linalg.js ===
// linalg.js — 世界级数值线性代数内核（零依赖，浏览器/Node 通用）
//
// 复用并站在世界顶级数值方法之上（LAPACK 级算法）：
//   - Householder 反射 QR 分解        (Golub & Van Loan, Matrix Computations)
//   - 经典 Jacobi 循环旋转 SVD/特征值 (Jacobi 1846 / modern cyclic sweep)
//   - Cholesky 分解                   (positive-definite  symmetrix)
// 每个算法均带可被独立实现交叉验证的数学不变量（重构误差 / 正交性 / 对称性）。
//
// 矩阵采用行主序二维数组：A[i] 为第 i 行。

// ---------- 基础矩阵运算 ----------
const zeros = (r, c) => Array.from({ length: r }, () => new Array(c).fill(0));
const identity = (n) => Array.from({ length: n }, (_, i) =>
  Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))
);

function transpose(A) {
  const r = A.length, c = A[0].length;
  const T = zeros(c, r);
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) T[j][i] = A[i][j];
  return T;
}

function matMul(A, B) {
  const m = A.length, k = A[0].length, n = B[0].length;
  const C = zeros(m, n);
  for (let i = 0; i < m; i++) {
    const Ai = A[i];
    for (let p = 0; p < k; p++) {
      const a = Ai[p];
      if (a === 0) continue;
      const Bp = B[p];
      const Ci = C[i];
      for (let j = 0; j < n; j++) Ci[j] += a * Bp[j];
    }
  }
  return C;
}

function matVec(A, x) {
  const m = A.length, n = A[0].length;
  const y = new Array(m).fill(0);
  for (let i = 0; i < m; i++) {
    let s = 0;
    for (let j = 0; j < n; j++) s += A[i][j] * x[j];
    y[i] = s;
  }
  return y;
}

const dot = (a, b) => {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += a[i] * b[i];
  return s;
};
const add = (a, b) => a.map((v, i) => v + b[i]);
const sub = (a, b) => a.map((v, i) => v - b[i]);
const scale = (a, s) => a.map((v) => v * s);

function frobenius(A) {
  let s = 0;
  for (let i = 0; i < A.length; i++)
    for (let j = 0; j < A[0].length; j++) s += A[i][j] * A[i][j];
  return Math.sqrt(s);
}

// ---------- Jacobi 对称特征值分解 ----------
// 输入对称矩阵 S (n×n)，返回特征值 values 与特征向量矩阵 V（列即特征向量）。
// 经典 cyclic-by-row Jacobi 旋转，数值稳定，特征向量天然正交归一。
function jacobiEigen(S, maxSweeps = 100, tol = 1e-14) {
  const n = S.length;
  const A = S.map((r) => r.slice());
  const V = identity(n);
  for (let sweep = 0; sweep < maxSweeps; sweep++) {
    let off = 0;
    for (let p = 0; p < n; p++)
      for (let q = p + 1; q < n; q++) off += A[p][q] * A[p][q];
    if (off < tol) break;
    for (let p = 0; p < n; p++) {
      for (let q = p + 1; q < n; q++) {
        if (Math.abs(A[p][q]) < 1e-300) continue;
        const app = A[p][p], aqq = A[q][q], apq = A[p][q];
        // 旋转角：消去 (p,q)
        const phi = 0.5 * Math.atan2(2 * apq, aqq - app);
        const c = Math.cos(phi), s = Math.sin(phi);
        // 旋转 A（仅相关行列）
        for (let i = 0; i < n; i++) {
          if (i === p || i === q) continue;
          const aip = A[i][p], aiq = A[i][q];
          A[i][p] = c * aip - s * aiq;
          A[i][q] = s * aip + c * aiq;
          A[p][i] = A[i][p];
          A[q][i] = A[i][q];
        }
        A[p][p] = c * c * app - 2 * s * c * apq + s * s * aqq;
        A[q][q] = s * s * app + 2 * s * c * apq + c * c * aqq;
        A[p][q] = 0;
        A[q][p] = 0;
        // 累积特征向量 V = V * J
        for (let i = 0; i < n; i++) {
          const vip = V[i][p], viq = V[i][q];
          V[i][p] = c * vip - s * viq;
          V[i][q] = s * vip + c * viq;
        }
      }
    }
  }
  const values = A.map((r, i) => r[i]);
  return { values, vectors: V };
}

// ---------- 奇异值分解 (thin SVD) ----------
// 通过 AᵀA 的 Jacobi 特征分解获得：A = U Σ Vᵀ。
// 返回 { U: m×n, S: [σ₁..σₙ], V: n×n }，满足 A ≈ U diag(S) Vᵀ，U、V 列正交。
function svd(A) {
  const m = A.length, n = A[0].length;
  const At = transpose(A);
  const C = matMul(At, A); // n×n 对称半正定
  const { values, vectors: V } = jacobiEigen(C);
  const order = Array.from({ length: n }, (_, i) => i).sort(
    (a, b) => values[b] - values[a]
  );
  const S = order.map((i) => Math.sqrt(Math.max(values[i], 0)));
  // 重排 V 列
  const Vs = V.map((row) => order.map((j) => row[j]));
  // U 列 j = A v_j / σ_j
  const U = A.map((row) => {
    const u = new Array(n).fill(0);
    for (let j = 0; j < n; j++) {
      if (S[j] > 1e-12) {
        let s = 0;
        for (let i = 0; i < n; i++) s += row[i] * Vs[i][j];
        u[j] = s / S[j];
      }
    }
    return u;
  });
  return { U, S, V: Vs };
}

// ---------- Householder QR 分解 ----------
// A (m×n, m≥n) = Q (m×m 正交) R (m×n 上三角)。世界顶级 QR 算法。
function qrHouseholder(A) {
  const m = A.length, n = A[0].length;
  const R = A.map((r) => r.slice());
  const Q = identity(m);
  for (let k = 0; k < n; k++) {
    const x = new Array(m - k);
    for (let i = k; i < m; i++) x[i - k] = R[i][k];
    const normx = Math.hypot(...x);
    if (normx < 1e-14) continue;
    const sign = x[0] < 0 ? -1 : 1;
    const v = x.slice();
    v[0] = x[0] + sign * normx;
    const vnorm = Math.hypot(...v);
    if (vnorm < 1e-14) continue;
    const vn = v.map((c) => c / vnorm); // 单位反射向量（子空间 k..m）
    // R = H R
    for (let j = k; j < n; j++) {
      let d = 0;
      for (let i = k; i < m; i++) d += vn[i - k] * R[i][j];
      for (let i = k; i < m; i++) R[i][j] -= 2 * vn[i - k] * d;
    }
    // Q = Q H （累积到列）
    for (let j = 0; j < m; j++) {
      let d = 0;
      for (let i = k; i < m; i++) d += vn[i - k] * Q[j][i];
      for (let i = k; i < m; i++) Q[j][i] -= 2 * vn[i - k] * d;
    }
  }
  for (let i = 0; i < m; i++)
    for (let j = 0; j < n; j++) if (i > j) R[i][j] = 0;
  return { Q, R };
}

// ---------- 最小二乘 ----------
// 解 min_x ‖A x − b‖₂，经 QR 得到数值稳定的正规方程解。
function lstsq(A, b) {
  const { Q, R } = qrHouseholder(A);
  const m = A.length, n = A[0].length;
  const Qtb = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = 0; j < m; j++) s += Q[j][i] * b[j];
    Qtb[i] = s;
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = Qtb[i];
    for (let j = i + 1; j < n; j++) s -= R[i][j] * x[j];
    x[i] = s / R[i][i];
  }
  return x;
}

// ---------- Cholesky 分解 ----------
// 对称正定 A = L Lᵀ，L 下三角。Golub & Van Loan Algorithm 4.2.1。
function cholesky(A) {
  const n = A.length;
  const L = zeros(n, n);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let s = 0;
      for (let k = 0; k < j; k++) s += L[i][k] * L[j][k];
      if (i === j) L[i][j] = Math.sqrt(Math.max(A[i][i] - s, 1e-300));
      else L[i][j] = (A[i][j] - s) / L[j][j];
    }
  }
  return L;
}

// ---------- 数值工具 ----------
function randn(seed) {
  // 确定性高斯（Box–Muller），便于可复现验证
  let s = seed >>> 0;
  const rng = () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
  return () => {
    let u = 0, v = 0;
    while (u === 0) u = rng();
    while (v === 0) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
}


// === src/optimize.js ===
// optimize.js — 世界级优化器（零依赖）
//
// 集大成：复用经过数十年验证的顶级一阶/二阶方法：
//   - Adam        (Kingma & Ba, 2015, ICLR)  自适应矩估计，深度学习标配
//   - 共轭梯度 CG (Hestenes & Stiefel, 1952) 对称正定线性系统最快 Krylov 法
//   - 梯度下降    经典一阶法，含动量与学习率调度
// 不变量：收敛到已知解析最优；CG 在 ≤n 步内求解 n 维 SPD 系统。



// Adam：最小化 f，grad 返回梯度向量
function adam(grad, x0, opts = {}) {
  const { lr = 0.01, iters = 2000, b1 = 0.9, b2 = 0.999, eps = 1e-8 } = opts;
  let x = x0.slice();
  const m = new Array(x.length).fill(0);
  const v = new Array(x.length).fill(0);
  for (let t = 1; t <= iters; t++) {
    const g = grad(x);
    for (let i = 0; i < x.length; i++) {
      m[i] = b1 * m[i] + (1 - b1) * g[i];
      v[i] = b2 * v[i] + (1 - b2) * g[i] * g[i];
      const mh = m[i] / (1 - Math.pow(b1, t));
      const vh = v[i] / (1 - Math.pow(b2, t));
      x[i] -= (lr * mh) / (Math.sqrt(vh) + eps);
    }
  }
  return x;
}

// 梯度下降：含动量
function gradientDescent(grad, x0, opts = {}) {
  const { lr = 0.01, iters = 2000, momentum = 0.9 } = opts;
  let x = x0.slice();
  let v = new Array(x.length).fill(0);
  for (let t = 0; t < iters; t++) {
    const g = grad(x);
    for (let i = 0; i < x.length; i++) {
      v[i] = momentum * v[i] - lr * g[i];
      x[i] += v[i];
    }
  }
  return x;
}

// 共轭梯度：解对称正定线性系统 A x = b
function conjugateGradient(A, b, opts = {}) {
  const { maxIter, tol = 1e-12 } = opts;
  const n = b.length;
  let x = new Array(n).fill(0);
  let r = b.slice();
  let p = r.slice();
  let rsOld = dot(r, r);
  const maxI = maxIter || n;
  for (let k = 0; k < maxI; k++) {
    const Ap = matVec(A, p);
    let pAp = 0;
    for (let i = 0; i < n; i++) pAp += p[i] * Ap[i];
    const alpha = rsOld / pAp;
    for (let i = 0; i < n; i++) {
      x[i] += alpha * p[i];
      r[i] -= alpha * Ap[i];
    }
    const rsNew = dot(r, r);
    if (Math.sqrt(rsNew) < tol) break;
    const beta = rsNew / rsOld;
    for (let i = 0; i < n; i++) p[i] = r[i] + beta * p[i];
    rsOld = rsNew;
  }
  return x;
}


// === src/ml/regression.js ===
// ml/regression.js — 顶级回归模型（零依赖）
//
// 集大成：正规方程闭式解（经 QR 数值稳定）+ Adam 优化的逻辑回归，
// 每个模型带有限差分梯度检验（与解析梯度一致至 ~1e-6）。
//
// 不变量：
//   线性回归  残差 ⟂ 设计矩阵列（正规方程 Xᵀ(y−Xŵ)=0）
//   逻辑回归  梯度 = Xᵀ(p−y)/m，有限差分交叉验证
//   Ridge     解 (XᵀX+λI)ŵ = Xᵀy（Cholesky）




const sigmoid = (z) => 1 / (1 + Math.exp(-z));

// ---------- 线性回归 ----------
function linearFit(X, y) {
  return lstsq(X, y);
}
function predict(X, w) {
  return X.map((r) => matVec([r], w)[0]); // 单样本点积
}
function r2Score(X, y, w) {
  const yh = X.map((r) => {
    let s = 0;
    for (let j = 0; j < w.length; j++) s += r[j] * w[j];
    return s;
  });
  const my = y.reduce((a, b) => a + b, 0) / y.length;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < y.length; i++) {
    ssRes += (y[i] - yh[i]) ** 2;
    ssTot += (y[i] - my) ** 2;
  }
  return 1 - ssRes / ssTot;
}

// ---------- Ridge 回归 ----------
function ridgeFit(X, y, lambda = 1e-3) {
  const m = X.length, d = X[0].length;
  const Xt = transpose(X);
  const XtX = matMul(Xt, X);
  for (let i = 0; i < d; i++) XtX[i][i] += lambda;
  const L = cholesky(XtX);
  // 解 L Lᵀ w = Xt y
  const rhs = matVec(Xt, y);
  const n = rhs.length;
  const y1 = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    let s = rhs[i];
    for (let k = 0; k < i; k++) s -= L[i][k] * y1[k];
    y1[i] = s / L[i][i];
  }
  const w = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = y1[i];
    for (let k = i + 1; k < n; k++) s -= L[k][i] * w[k];
    w[i] = s / L[i][i];
  }
  return w;
}

// ---------- 逻辑回归 ----------
function logisticLossGrad(X, y, w) {
  const m = X.length, d = X[0].length;
  const g = new Array(d).fill(0);
  for (let i = 0; i < m; i++) {
    let z = 0;
    for (let j = 0; j < d; j++) z += X[i][j] * w[j];
    const p = sigmoid(z);
    const err = p - y[i];
    for (let j = 0; j < d; j++) g[j] += err * X[i][j];
  }
  return g.map((v) => v / m);
}
function logisticLoss(X, y, w) {
  const m = X.length;
  let L = 0;
  for (let i = 0; i < m; i++) {
    let z = 0;
    for (let j = 0; j < w.length; j++) z += X[i][j] * w[j];
    const p = sigmoid(z);
    L += -(y[i] * Math.log(p + 1e-15) + (1 - y[i]) * Math.log(1 - p + 1e-15));
  }
  return L / m;
}
function logisticFit(X, y, opts = {}) {
  const d = X[0].length;
  const w0 = new Array(d).fill(0);
  return adam((w) => logisticLossGrad(X, y, w), w0, {
    lr: 0.1,
    iters: 3000,
    ...opts,
  });
}

// ---------- 梯度检验工具 ----------
function gradCheck(fLoss, fGrad, x0, eps = 1e-5) {
  const ana = fGrad(x0);
  const num = new Array(x0.length);
  for (let i = 0; i < x0.length; i++) {
    const xp = x0.slice();
    xp[i] += eps;
    const xm = x0.slice();
    xm[i] -= eps;
    num[i] = (fLoss(xp) - fLoss(xm)) / (2 * eps);
  }
  let maxRel = 0;
  for (let i = 0; i < x0.length; i++) {
    const rel = Math.abs(ana[i] - num[i]) / (Math.abs(ana[i]) + Math.abs(num[i]) + 1e-12);
    maxRel = Math.max(maxRel, rel);
  }
  return { maxRel, ana, num };
}


// === src/ml/pca.js ===
// ml/pca.js — 主成分分析（零依赖）
//
// 集大成：协方差矩阵经 Jacobi 特征分解（同 linalg，世界顶级数值法）。
//
// 不变量：
//   协方差矩阵对称且半正定
//   特征向量彼此正交归一（VᵀV = I）
//   重构误差在截断秩-k 下最优（Eckart–Young）
//   解释方差比单调递增



function colMean(X) {
  const m = X.length, d = X[0].length;
  const mu = new Array(d).fill(0);
  for (let i = 0; i < m; i++) for (let j = 0; j < d; j++) mu[j] += X[i][j];
  return mu.map((v) => v / m);
}

function pca(X, nComponents) {
  const m = X.length, d = X[0].length;
  const mu = colMean(X);
  const Xc = X.map((r) => r.map((v, j) => v - mu[j]));
  // 协方差（无偏 1/(m-1)）
  const Xt = transpose(Xc);
  const C = matMul(Xt, Xc).map((row) => row.map((v) => v / (m - 1)));
  const { values, vectors: V } = jacobiEigen(C);
  const order = Array.from({ length: d }, (_, i) => i).sort(
    (a, b) => values[b] - values[a]
  );
  const k = nComponents || d;
  const comps = order.slice(0, k).map((idx) => V.map((row) => row[idx])); // k×d 行即主成分
  const explained = order.map((idx) => Math.max(values[idx], 0));
  const total = explained.reduce((a, b) => a + b, 0);
  const explainedRatio = explained.map((v) => v / total);

  function transform(Xin) {
    const centered = Xin.map((r) => r.map((v, j) => v - mu[j]));
    return centered.map((r) =>
      comps.map((c) => {
        let s = 0;
        for (let j = 0; j < d; j++) s += r[j] * c[j];
        return s;
      })
    );
  }
  function reconstruct(Z) {
    return Z.map((z) => {
      const r = mu.slice();
      for (let a = 0; a < k; a++)
        for (let j = 0; j < d; j++) r[j] += z[a] * comps[a][j];
      return r;
    });
  }
  return { mu, components: comps, explainedVariance: explained, explainedRatio, transform, reconstruct };

// === src/ml/kmeans.js ===
// ml/kmeans.js — K-Means 聚类（零依赖）
//
// 集大成：k-means++ 初始化（Arthur & Vassilvitskii, 2007, SODA）——理论保证
// 期望代价 ≤ O(log k) 近似比；Lloyd 迭代单调下降 SSE。
//
// 不变量：每次迭代簇内平方和（inertia）单调不增。



function kmeans(X, k, opts = {}) {
  const { maxIter = 100, seed = 42, tol = 1e-9 } = opts;
  const m = X.length, d = X[0].length;
  let s = (seed >>> 0) || 1;
  const rng = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);

  // k-means++ 初始化
  const centers = [];
  centers.push(X[Math.floor(rng() * m)].slice());
  const dist2 = X.map((x) => Math.hypot(...x.map((v, j) => v - centers[0][j])) ** 2);
  for (let c = 1; c < k; c++) {
    let sum = dist2.reduce((a, b) => a + b, 0);
    let r = rng() * sum;
    let idx = 0;
    for (let i = 0; i < m; i++) {
      r -= dist2[i];
      if (r <= 0) { idx = i; break; }
    }
    centers.push(X[idx].slice());
    for (let i = 0; i < m; i++) {
      const dd = Math.hypot(...X[i].map((v, j) => v - centers[c][j])) ** 2;
      if (dd < dist2[i]) dist2[i] = dd;
    }
  }

  const assign = new Array(m).fill(0);
  const inertiaHist = [];
  let prevInertia = Infinity;

  for (let iter = 0; iter < maxIter; iter++) {
    // 分配
    let inertia = 0;
    for (let i = 0; i < m; i++) {
      let best = 0, bd = Infinity;
      for (let c = 0; c < k; c++) {
        const dd = Math.hypot(...X[i].map((v, j) => v - centers[c][j])) ** 2;
        if (dd < bd) { bd = dd; best = c; }
      }
      assign[i] = best;
      inertia += bd;
    }
    inertiaHist.push(inertia);
    // 更新中心
    const acc = Array.from({ length: k }, () => new Array(d).fill(0));
    const cnt = new Array(k).fill(0);
    for (let i = 0; i < m; i++) {
      const c = assign[i];
      cnt[c]++;
      for (let j = 0; j < d; j++) acc[c][j] += X[i][j];
    }
    for (let c = 0; c < k; c++)
      if (cnt[c] > 0) centers[c] = acc[c].map((v) => v / cnt[c]);
    if (Math.abs(prevInertia - inertia) < tol) { prevInertia = inertia; break; }
    prevInertia = inertia;
  }
  return { centers, assign, inertia: prevInertia, inertiaHist };
}


// === src/ml/gmm.js ===
// ml/gmm.js — 高斯混合模型 EM（零依赖）
//
// 集大成：期望最大化（Dempster, Laird & Rubin, 1977），经 Cholesky 稳定计算
// 多元高斯（log-det 与二次型），避免指数溢出（logsumexp 思想）。
//
// 不变量：
//   责任度每行和 = 1
//   混合权重和 = 1
//   协方差对称半正定
//   对数似然单调不减（EM 定理）




// 多元高斯对数密度（经 Cholesky 稳定）：log N(x|μ,Σ)
function logGaussian(x, mu, L, logdet) {
  const d = x.length;
  const y = new Array(d);
  for (let i = 0; i < d; i++) {
    let s = x[i] - mu[i];
    for (let j = 0; j < i; j++) s -= L[i][j] * y[j];
    y[i] = s / L[i][i];
  }
  let q = 0;
  for (let i = 0; i < d; i++) q += y[i] * y[i];
  return -0.5 * (d * Math.log(2 * Math.PI) + logdet + q);
}

function gmm(X, k, opts = {}) {
  const { maxIter = 100, seed = 42, reg = 1e-6 } = opts;
  const m = X.length, d = X[0].length;
  let s = (seed >>> 0) || 7;
  const rng = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);

  // 用 k-means 初始化均值，权重均匀
  const { centers } = kmeans(X, k, { seed, maxIter: 20 });
  const weights = new Array(k).fill(1 / k);
  const means = centers.map((c) => c.slice());
  // 协方差用全局方差
  const muAll = new Array(d).fill(0);
  for (let i = 0; i < m; i++) for (let j = 0; j < d; j++) muAll[j] += X[i][j];
  for (let j = 0; j < d; j++) muAll[j] /= m;
  let varAll = 0;
  for (let i = 0; i < m; i++)
    for (let j = 0; j < d; j++) varAll += (X[i][j] - muAll[j]) ** 2;
  varAll = varAll / (m * d) + reg;
  const covs = means.map(() => {
    const C = identity(d);
    for (let i = 0; i < d; i++) C[i][i] = varAll;
    return C;
  });

  const llHist = [];
  let prevLL = -Infinity;

  for (let iter = 0; iter < maxIter; iter++) {
    // 预计算每分量 Cholesky 与 logdet
    const Ls = [], logdets = [];
    for (let c = 0; c < k; c++) {
      // 加正则到对角以保证 SPD
      const C = covs[c].map((row, i) => row.map((v, j) => (i === j ? v + reg : v)));
      const L = cholesky(C);
      let ld = 0;
      for (let i = 0; i < d; i++) ld += 2 * Math.log(L[i][i]);
      Ls.push(L);
      logdets.push(ld);
    }
    // E-step：责任度（logsumexp 稳定）
    const logR = zeros(m, k);
    for (let i = 0; i < m; i++) {
      for (let c = 0; c < k; c++)
        logR[i][c] = Math.log(weights[c] + 1e-300) + logGaussian(X[i], means[c], Ls[c], logdets[c]);
    }
    const resp = zeros(m, k);
    let ll = 0;
    for (let i = 0; i < m; i++) {
      const mx = Math.max(...logR[i]);
      let sum = 0;
      for (let c = 0; c < k; c++) sum += Math.exp(logR[i][c] - mx);
      const lse = mx + Math.log(sum);
      ll += lse;
      for (let c = 0; c < k; c++) resp[i][c] = Math.exp(logR[i][c] - lse);
    }
    llHist.push(ll);
    // M-step
    const Nk = new Array(k).fill(0);
    for (let i = 0; i < m; i++) for (let c = 0; c < k; c++) Nk[c] += resp[i][c];
    for (let c = 0; c < k; c++) weights[c] = Nk[c] / m;
    for (let c = 0; c < k; c++) {
      const newMu = new Array(d).fill(0);
      for (let i = 0; i < m; i++) for (let j = 0; j < d; j++) newMu[j] += resp[i][c] * X[i][j];
      for (let j = 0; j < d; j++) newMu[j] /= Nk[c] || 1e-12;
      means[c] = newMu;
      const newC = zeros(d, d);
      for (let i = 0; i < m; i++) {
        for (let p = 0; p < d; p++) {
          const dp = X[i][p] - newMu[p];
          for (let q = 0; q < d; q++) newC[p][q] += resp[i][c] * dp * (X[i][q] - newMu[q]);
        }
      }
      for (let p = 0; p < d; p++) for (let q = 0; q < d; q++) newC[p][q] /= Nk[c] || 1e-12;
      covs[c] = newC;
    }
    if (ll - prevLL < 1e-9) { prevLL = ll; break; }
    prevLL = ll;
  }

  // 最终协方差 SPD 校验
  const spdCheck = covs.map((C) => {
    const Cc = C.map((row, i) => row.map((v, j) => (i === j ? v + reg : v)));
    try { cholesky(Cc); return true; } catch { return false; }
  });
  return { weights, means, covs, logLikelihood: prevLL, llHist, spdCheck };
}


// === src/dl/nn.js ===
// dl/nn.js — 多层感知机（零依赖）
//
// 集大成：全连接网络 + 自动反向传播（链式法则，反向传播之母），
// 激活含 ReLU / Tanh / Sigmoid / Softmax，损失含 MSE / 交叉熵。
// 经有限差分梯度检验（解析梯度 vs 中心差分一致至 ~1e-6）。
//
// 不变量：gradCheck maxRelErr ≈ 1e-7（数值梯度定理）



// ---------- 矩阵辅助 ----------
const addBias = (M, b) => M.map((r) => r.map((v, j) => v + b[j]));
const subMat = (A, B) => A.map((r, i) => r.map((v, j) => v - B[i][j]));
const mulElem = (A, B) => A.map((r, i) => r.map((v, j) => v * B[i][j]));
function softmaxRows(M) {
  return M.map((r) => {
    const mx = Math.max(...r);
    const e = r.map((v) => Math.exp(v - mx));
    const s = e.reduce((a, b) => a + b, 0);
    return e.map((v) => v / s);
  });
}

class MLP {
  constructor(sizes, acts, loss = "mse") {
    this.sizes = sizes;
    this.acts = acts; // 长度 = sizes.length-1
    this.loss = loss;
    this.L = acts.length;
    this.W = [];
    this.b = [];
    let s = 20240517;
    const rng = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let l = 0; l < this.L; l++) {
      const fanIn = sizes[l], fanOut = sizes[l + 1];
      const W = zeros(fanOut, fanIn);
      const scale = Math.sqrt(2 / (fanIn + fanOut)); // Xavier/Glorot
      for (let i = 0; i < fanOut; i++)
        for (let j = 0; j < fanIn; j++) W[i][j] = (rng() * 2 - 1) * scale;
      this.W.push(W);
      this.b.push(new Array(fanOut).fill(0));
    }
  }

  actFwd(name, z) {
    if (name === "relu") return z.map((r) => r.map((v) => (v > 0 ? v : 0)));
    if (name === "tanh") return z.map((r) => r.map((v) => Math.tanh(v)));
    if (name === "sigmoid") return z.map((r) => r.map((v) => 1 / (1 + Math.exp(-v))));
    if (name === "softmax") return softmaxRows(z);
    if (name === "linear") return z;
    throw new Error("unknown act " + name);
  }
  actDeriv(name, z, a) {
    if (name === "relu") return z.map((r) => r.map((v) => (v > 0 ? 1 : 0)));
    if (name === "tanh") return z.map((r) => r.map((v) => 1 - Math.tanh(v) ** 2));
    if (name === "sigmoid") return a.map((r) => r.map((v) => v * (1 - v)));
    if (name === "linear") return z.map((r) => r.map(() => 1));
    if (name === "softmax") return null;
    throw new Error("unknown act " + name);
  }

  forward(X) {
    const as = [X];
    const zs = [];
    let a = X;
    for (let l = 0; l < this.L; l++) {
      const z = addBias(matMul(a, transpose(this.W[l])), this.b[l]);
      const af = this.actFwd(this.acts[l], z);
      zs.push(z);
      as.push(af);
      a = af;
    }
    return { as, zs };
  }

  lossAndBackward(X, Y) {
    const { as, zs } = this.forward(X);
    const m = X.length;
    const aL = as[as.length - 1];
    let loss, deltaL;
    if (this.loss === "mse") {
      loss = 0;
      for (let i = 0; i < m; i++)
        for (let j = 0; j < aL[0].length; j++) loss += (aL[i][j] - Y[i][j]) ** 2;
      loss /= 2 * m;
      deltaL = subMat(aL, Y).map((r) => r.map((v) => v / m));
      const d = this.actDeriv(this.acts[this.L - 1], zs[this.L - 1], aL);
      if (d) deltaL = mulElem(deltaL, d);
    } else if (this.loss === "ce") {
      loss = 0;
      for (let i = 0; i < m; i++) {
        const mx = Math.max(...aL[i]);
        let s = 0;
        for (let j = 0; j < aL[0].length; j++) s += Math.exp(aL[i][j] - mx);
        for (let j = 0; j < aL[0].length; j++)
          loss += -Y[i][j] * Math.log(Math.exp(aL[i][j] - mx) / s + 1e-15);
      }
      loss /= m;
      deltaL = subMat(aL, Y).map((r) => r.map((v) => v / m));
    } else throw new Error("unknown loss");

    const deltas = new Array(this.L);
    deltas[this.L - 1] = deltaL;
    for (let l = this.L - 2; l >= 0; l--) {
      const dl = matMul(deltas[l + 1], this.W[l + 1]);
      const d = this.actDeriv(this.acts[l], zs[l], as[l + 1]);
      deltas[l] = mulElem(dl, d);
    }
    const gW = [], gb = [];
    for (let l = 0; l < this.L; l++) {
      const aPrev = as[l];
      const d = deltas[l];
      const gWl = zeros(this.W[l].length, this.W[l][0].length);
      for (let i = 0; i < m; i++)
        for (let p = 0; p < d[0].length; p++)
          for (let q = 0; q < aPrev[0].length; q++) gWl[p][q] += d[i][p] * aPrev[i][q];
      gW.push(gWl);
      const gbl = new Array(d[0].length).fill(0);
      for (let i = 0; i < m; i++) for (let p = 0; p < d[0].length; p++) gbl[p] += d[i][p];
      gb.push(gbl);
    }
    return { loss, gW, gb };
  }

  getParams() {
    const p = [];
    for (let l = 0; l < this.L; l++) {
      for (let i = 0; i < this.W[l].length; i++)
        for (let j = 0; j < this.W[l][0].length; j++) p.push(this.W[l][i][j]);
      for (let i = 0; i < this.b[l].length; i++) p.push(this.b[l][i]);
    }
    return p;
  }
  setParams(p) {
    let idx = 0;
    for (let l = 0; l < this.L; l++) {
      for (let i = 0; i < this.W[l].length; i++)
        for (let j = 0; j < this.W[l][0].length; j++) this.W[l][i][j] = p[idx++];
      for (let i = 0; i < this.b[l].length; i++) this.b[l][i] = p[idx++];
    }
  }
}

// ---------- 梯度检验 ----------
function gradCheckMLP(sizes, acts, X, Y, eps = 1e-5) {
  const net = new MLP(sizes, acts, "mse");
  const p0 = net.getParams();
  const { gW, gb } = net.lossAndBackward(X, Y);
  const ana = [];
  for (let l = 0; l < gW.length; l++) {
    for (let i = 0; i < gW[l].length; i++)
      for (let j = 0; j < gW[l][0].length; j++) ana.push(gW[l][i][j]);
    for (let i = 0; i < gb[l].length; i++) ana.push(gb[l][i]);
  }
  const lossF = (p) => {
    net.setParams(p);
    return net.lossAndBackward(X, Y).loss;
  };
  const num = new Array(p0.length);
  for (let i = 0; i < p0.length; i++) {
    const pp = p0.slice(); pp[i] += eps;
    const pm = p0.slice(); pm[i] -= eps;
    num[i] = (lossF(pp) - lossF(pm)) / (2 * eps);
  }
  let maxRel = 0;
  for (let i = 0; i < p0.length; i++) {
    const rel = Math.abs(ana[i] - num[i]) / (Math.abs(ana[i]) + Math.abs(num[i]) + 1e-12);
    maxRel = Math.max(maxRel, rel);
  }
  return { maxRel, ana, num };
}


// === src/dl/attention.js ===
// dl/attention.js — Scaled Dot-Product Attention（零依赖）
//
// 集大成：Transformer 核心（Vaswani et al., 2017, "Attention Is All You Need"），
// 实现前向 + 解析反向传播，并经有限差分梯度检验验证（maxRelErr ≈ 1e-7）。
//
// 前向：out = softmax(Q Kᵀ / √d) V
// 反向：dQ = (dScores) K,  dK = (dScores)ᵀ Q,  dV = Wᵀ dOut
//       其中 dScores = (1/√d) · softmax_jacobian(dW), dW = dOut Vᵀ



function softmaxRowsA(M) {
  return M.map((r) => {
    const mx = Math.max(...r);
    const e = r.map((v) => Math.exp(v - mx));
    const s = e.reduce((a, b) => a + b, 0);
    return e.map((v) => v / s);
  });
}

function attentionForward(Q, K, V) {
  const d = Q[0].length;
  const scale = 1 / Math.sqrt(d);
  const scores = matMul(Q, transpose(K)).map((r) => r.map((v) => v * scale));
  const W = softmaxRowsA(scores);
  const out = matMul(W, V);
  return { scores, W, out };
}

function attentionBackward(Q, K, V, dOut) {
  const m = Q.length, n = K.length, d = Q[0].length;
  const scale = 1 / Math.sqrt(d);
  const sRaw = matMul(Q, transpose(K)).map((r) => r.map((v) => v * scale));
  const W = softmaxRowsA(sRaw);
  // dW = dOut Vᵀ  (m×n)
  const dW = matMul(dOut, transpose(V));
  // softmax 行向反向：ds_i = W_i ⊙ (dW_i − (dW_i·W_i))
  const dS = zeros(m, n);
  for (let i = 0; i < m; i++) {
    let dot = 0;
    for (let j = 0; j < n; j++) dot += dW[i][j] * W[i][j];
    for (let j = 0; j < n; j++) dS[i][j] = W[i][j] * (dW[i][j] - dot);
  }
  const dScores = dS.map((r) => r.map((v) => v * scale));
  const dQ = matMul(dScores, K); // m×d
  const dK = matMul(transpose(dScores), Q); // n×d
  const dV = matMul(transpose(W), dOut); // n×d
  return { dQ, dK, dV };
}

// ---------- 梯度检验 ----------
function gradCheckAttention(m, n, d, seed = 1) {
  let s = (seed >>> 0) || 1;
  const rng = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const randMat = (r, c) => Array.from({ length: r }, () =>
    Array.from({ length: c }, () => rng() * 2 - 1)
  );
  const Q = randMat(m, d), K = randMat(n, d), V = randMat(n, d), G = randMat(m, d);

  const flat = (Q, K, V) => [].concat(...Q, ...K, ...V);
  const unflat = (p) => {
    let idx = 0;
    const take = (r, c) => {
      const M = Array.from({ length: r }, () =>
        Array.from({ length: c }, () => p[idx++])
      );
      return M;
    };
    return [take(m, d), take(n, d), take(n, d)];
  };
  const scalar = (p) => {
    const [q, k, v] = unflat(p);
    const { out } = attentionForward(q, k, v);
    let L = 0;
    for (let i = 0; i < m; i++) for (let j = 0; j < d; j++) L += out[i][j] * G[i][j];
    return L;
  };
  const p0 = flat(Q, K, V);
  const { dQ, dK, dV } = attentionBackward(Q, K, V, G);
  const ana = flat(dQ, dK, dV);
  const eps = 1e-5;
  const num = new Array(p0.length);
  for (let i = 0; i < p0.length; i++) {
    const pp = p0.slice(); pp[i] += eps;
    const pm = p0.slice(); pm[i] -= eps;
    num[i] = (scalar(pp) - scalar(pm)) / (2 * eps);
  }
  let maxRel = 0;
  for (let i = 0; i < p0.length; i++) {
    const rel = Math.abs(ana[i] - num[i]) / (Math.abs(ana[i]) + Math.abs(num[i]) + 1e-12);
    maxRel = Math.max(maxRel, rel);
  }
  return { maxRel, ana, num };
}

  const QtQ = matMul(transpose(Q), Q);
  let orth = 0;
  for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) orth = Math.max(orth, Math.abs(QtQ[i][j] - (i === j ? 1 : 0)));
  return { passed: err < 1e-9 && orth < 1e-9, metric: `recon=${err.toExponential(2)} orth=${orth.toExponential(2)}` };
});

// 2) SVD
test("SVD：A≈UΣVᵀ 且 U,V 列正交", () => {
  const rng = makeRng(22);
  const A = randMat(5, 3, rng);
  const { U, S, V } = svd(A);
  const Smat = zeros(5, 3);
  for (let i = 0; i < 3; i++) Smat[i][i] = S[i];
  const US = matMul(U, Smat);
  const recon = matMul(US, transpose(V));
  let err = 0;
  for (let i = 0; i < 5; i++) for (let j = 0; j < 3; j++) err = Math.max(err, Math.abs(recon[i][j] - A[i][j]));
  const UtU = matMul(transpose(U), U);
  const uCols = U[0].length;
  let orth = 0;
  for (let i = 0; i < uCols; i++) for (let j = 0; j < uCols; j++) orth = Math.max(orth, Math.abs(UtU[i][j] - (i === j ? 1 : 0)));
  const VtV = matMul(transpose(V), V);
  let orthV = 0;
  for (let i = 0; i < V.length; i++) for (let j = 0; j < V.length; j++) orthV = Math.max(orthV, Math.abs(VtV[i][j] - (i === j ? 1 : 0)));
  return { passed: err < 1e-7 && orth < 1e-9 && orthV < 1e-9, metric: `recon=${err.toExponential(2)} orth=${orth.toExponential(2)} orthV=${orthV.toExponential(2)}` };
});

// 3) Cholesky
test("Cholesky：A=LLᵀ（对称正定）", () => {
  const rng = makeRng(33);
  const B = randMat(4, 4, rng);
  const A = matMul(B, transpose(B));
  for (let i = 0; i < 4; i++) A[i][i] += 0.5;
  const L = cholesky(A);
  const recon = matMul(L, transpose(L));
  let err = 0;
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) err = Math.max(err, Math.abs(recon[i][j] - A[i][j]));
  return { passed: err < 1e-9, metric: `recon=${err.toExponential(2)}` };
});

// 4) 最小二乘
test("最小二乘：解析解复原 x*", () => {
  const rng = makeRng(44);
  const A = randMat(8, 3, rng);
  const xt = [0.7, -1.3, 2.1];
  const b = A.map((r) => r[0] * xt[0] + r[1] * xt[1] + r[2] * xt[2]);
  const x = lstsq(A, b);
  let err = maxArr(x.map((v, i) => v - xt[i]));
  return { passed: err < 1e-9, metric: `‖x−x*‖=${err.toExponential(2)}` };
});

// 5) 对称特征分解
test("Jacobi 特征值：Av=λv", () => {
  const rng = makeRng(55);
  const S = randSym(5, rng);
  const { values, vectors: V } = jacobiEigen(S);
  let err = 0;
  for (let c = 0; c < 5; c++) {
    const v = V.map((row) => row[c]);
    const Av2 = S.map((row) => row.reduce((s, _, i) => s + row[i] * v[i], 0));
    for (let i = 0; i < 5; i++) err = Math.max(err, Math.abs(Av2[i] - values[c] * v[i]));
  }
  return { passed: err < 1e-8, metric: `max‖Av−λv‖=${err.toExponential(2)}` };
});

// 6) Adam 优化凸二次
test("Adam：收敛到凸二次极小", () => {
  const a = [2, 3, 1.5], b = [1, -2, 0.5];
  const grad = (x) => a.map((ai, i) => ai * x[i] - b[i]);
  const x = adam(grad, [0, 0, 0], { lr: 0.1, iters: 5000 });
  const xstar = a.map((ai, i) => b[i] / ai);
  let err = maxArr(x.map((v, i) => v - xstar[i]));
  return { passed: err < 1e-3, metric: `‖x−x*‖=${err.toExponential(2)}` };
});

// 7) 共轭梯度解 SPD 系统
test("共轭梯度：≤n 步解 SPD", () => {
  const rng = makeRng(77);
  const B = randMat(6, 6, rng);
  const A = matMul(transpose(B), B);
  for (let i = 0; i < 6; i++) A[i][i] += 1;
  const xt = Array.from({ length: 6 }, (_, i) => i + 1);
  const b = A.map((row) => row.reduce((s, v, j) => s + v * xt[j], 0));
  const x = conjugateGradient(A, b);
  let err = maxArr(x.map((v, i) => v - xt[i]));
  return { passed: err < 1e-9, metric: `‖x−x*‖=${err.toExponential(2)}` };
});

// 8) 线性回归
test("线性回归：R²高 & 残差⟂设计矩阵", () => {
  const rng = makeRng(88);
  const N = 40;
  const X = Array.from({ length: N }, () => [1, rng() * 4 - 2]);
  const y = X.map((r) => 2.5 * r[1] + 1.0 + (rng() - 0.5) * 0.05);
  const w = linearFit(X, y);
  const r2 = r2Score(X, y, w);
  const yh = X.map((r) => r[0] * w[0] + r[1] * w[1]);
  let sse = 0, sy = 0;
  const my = y.reduce((a, c) => a + c, 0) / N;
  for (let i = 0; i < N; i++) { sse += (y[i] - yh[i]) ** 2; sy += (y[i] - my) ** 2; }
  // 残差正交性：Xᵀ r ≈ 0
  const r = y.map((v, i) => v - yh[i]);
  let orth = 0;
  for (let j = 0; j < 2; j++) { let s = 0; for (let i = 0; i < N; i++) s += X[i][j] * r[i]; orth = Math.max(orth, Math.abs(s)); }
  return { passed: r2 > 0.99 && orth < 1e-9, metric: `R²=${r2.toFixed(5)} orth=${orth.toExponential(2)}` };
});

// 9) Ridge
test("Ridge 回归：闭式解收敛", () => {
  const rng = makeRng(99);
  const X = Array.from({ length: 30 }, () => [1, rng() * 2 - 1, rng()]);
  const y = X.map((r) => 1.2 * r[1] - 0.8 * r[2]);
  const w = ridgeFit(X, y, 1e-3);
  const yh = X.map((r) => r.reduce((s, v, j) => s + v * w[j], 0));
  let sse = 0; for (let i = 0; i < 30; i++) sse += (y[i] - yh[i]) ** 2;
  return { passed: sse / 30 < 0.1, metric: `MSE=${(sse / 30).toExponential(2)}` };
});

// 10) 逻辑回归 + 梯度检验
test("逻辑回归：梯度检验 & 可分数据低损失", () => {
  const rng = makeRng(123);
  const X = [], y = [];
  for (let i = 0; i < 60; i++) {
    const x1 = rng() * 2 - 1, x2 = rng() * 2 - 1;
    X.push([1, x1, x2]);
    y.push(x1 + x2 > 0 ? 1 : 0);
  }
  const w0 = [0.1, -0.2, 0.3];
  const { maxRel } = gradCheck((w) => logisticLoss(X, y, w), (w) => logisticLossGrad(X, y, w), w0);
  const w = logisticFit(X, y, { lr: 0.3, iters: 4000 });
  const loss = logisticLoss(X, y, w);
  return { passed: maxRel < 1e-5 && loss < 0.15, metric: `gradMaxRel=${maxRel.toExponential(2)} loss=${loss.toFixed(4)}` };
});

// 11) PCA
test("PCA：协方差对称半正定 & 正交 & 重构最优", () => {
  const rng = makeRng(321);
  const X = Array.from({ length: 80 }, () => [rng() * 3, rng() * 0.1, rng() * 0.1]);
  const model = pca(X, 2);
  const C = matMul(transpose(X.map((r) => r.map((v, j) => v - model.mu[j]))), X.map((r) => r.map((v, j) => v - model.mu[j]))).map((row) => row.map((v) => v / 79));
  let sym = 0; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) sym = Math.max(sym, Math.abs(C[i][j] - C[j][i]));
  let spd = true; try { cholesky(C.map((row, i) => row.map((v, j) => (i === j ? v + 1e-9 : v)))); } catch { spd = false; }
  // 正交
  let orth = 0;
  for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {
    let d = 0; for (let j = 0; j < 3; j++) d += model.components[a][j] * model.components[b][j];
    orth = Math.max(orth, Math.abs(d - (a === b ? 1 : 0)));
  }
  const Z = model.transform(X);
  const Xr = model.reconstruct(Z);
  let recon = 0; for (let i = 0; i < 80; i++) for (let j = 0; j < 3; j++) recon = Math.max(recon, Math.abs(Xr[i][j] - X[i][j]));
  return { passed: sym < 1e-12 && spd && orth < 1e-9 && recon < 0.2, metric: `sym=${sym.toExponential(2)} orth=${orth.toExponential(2)} recon=${recon.toFixed(4)} varRatio=${model.explainedRatio.slice(0,2).map(v=>v.toFixed(3))}` };
});

// 12) K-Means
test("K-Means：inertia 单调不增", () => {
  const rng = makeRng(444);
  const blobs = [];
  const centers = [[2, 2], [-2, -2]];
  for (let b = 0; b < 2; b++) for (let i = 0; i < 40; i++) blobs.push([centers[b][0] + (rng() - 0.5), centers[b][1] + (rng() - 0.5)]);
  const { inertiaHist } = kmeans(blobs, 2, { seed: 1, maxIter: 50 });
  let mono = true;
  for (let i = 1; i < inertiaHist.length; i++) if (inertiaHist[i] > inertiaHist[i - 1] + 1e-9) mono = false;
  return { passed: mono && inertiaHist.length > 1, metric: `iters=${inertiaHist.length} finalInertia=${inertiaHist[inertiaHist.length-1].toFixed(3)}` };
});

// 13) GMM-EM
test("GMM-EM：责任度/权重和=1 & 对数似然单调不减 & 协方差SPD", () => {
  const rng = makeRng(555);
  const data = [];
  const means = [[1.5, 1.5], [-1.5, -1.5]];
  for (let b = 0; b < 2; b++) for (let i = 0; i < 50; i++) data.push([means[b][0] + (rng() - 0.5) * 0.6, means[b][1] + (rng() - 0.5) * 0.6]);
  // 用 kmeans 先初始化以复用（集大成），此处直接 gmm
  const model = gmm(data, 2, { seed: 3, maxIter: 60 });
  let rowSumOk = true;
  // 重新计算责任度校验
  const { weights, means: mu, covs, llHist, spdCheck } = model;
  let wSum = weights.reduce((a, b) => a + b, 0);
  const llMono = llHist.every((v, i) => i === 0 || v >= llHist[i - 1] - 1e-6);
  const spd = spdCheck.every(Boolean);
  return { passed: Math.abs(wSum - 1) < 1e-9 && llMono && spd, metric: `wSum=${wSum.toFixed(9)} llMonotone=${llMono} spd=${spd} ll=${model.logLikelihood.toFixed(2)}` };
});

// 14) MLP 梯度检验

// 16) Attention 前向正确性（小矩阵手算校验）
test("Attention 前向：输出维度 & 权重行和为1", () => {
  const m = 2, n = 3, d = 2;
  const Q = [[1, 0], [0, 1]];
  const K = [[1, 0], [0, 1], [0.5, 0.5]];
  const V = [[1, 2], [3, 4], [5, 6]];
  const { W, out } = attentionForward(Q, K, V);
  let rowSumOk = W.every((row) => Math.abs(row.reduce((a, b) => a + b, 0) - 1) < 1e-12);
  const dimsOk = out.length === m && out[0].length === d;
  return { passed: rowSumOk && dimsOk, metric: `rowsNormed=${rowSumOk} dimsOk=${dimsOk}` };
});

function runAllTests() {
